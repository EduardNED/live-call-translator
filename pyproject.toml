[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "call-translator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["google-genai==2.31.0", "sounddevice==0.5.6"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
call-translator = "call_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
